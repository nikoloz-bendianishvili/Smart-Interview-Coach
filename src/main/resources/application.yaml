spring:
  application:
    name: interview-coach
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interview_coach}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

brevo:
  api:
    key: ${BREVO_API_KEY}

sender: ${SENDER_EMAIL}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:8080}
  seed:
    enabled: ${SEED_ENABLED:false}
  session:
    time-limit-multiplier:
      real-interview: ${REAL_INTERVIEW_TIME_MULTIPLIER:1.10}
      free-mock: ${FREE_MOCK_TIME_MULTIPLIER:1.50}
      custom-practice: ${CUSTOM_PRACTICE_TIME_MULTIPLIER:2.00}
    grace-period-seconds: ${SESSION_GRACE_PERIOD_SECONDS:30}
    sweep-interval-ms: ${SESSION_SWEEP_INTERVAL_MS:60000}
  grading:
    stale-pending-minutes: ${STALE_PENDING_MINUTES:30}

judge0:
  api:
    url: ${JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}
    key: ${JUDGE0_API_KEY:}

ai:
  model: ${AI_MODEL:claude-sonnet-5}
  api:
    key: ${ANTHROPIC_API_KEY:}